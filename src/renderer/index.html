<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>rec.io</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2" /></svg></span>
        <span class="brand-name">rec<span class="io">.io</span></span>
      </div>
      <div class="status-pills">
        <span class="badge" title="Audio and text never leave this PC"><i></i>Offline</span>
        <span id="engine-pill" class="badge engine loading"><i></i><span id="engine-text">Starting…</span></span>
      </div>

      <button id="new-recording" class="btn btn-primary btn-block" disabled><span class="dot" aria-hidden="true"></span>New recording</button>

      <nav id="meeting-list" class="meeting-list" aria-label="Recordings"></nav>

      <div class="sidebar-foot">
        <button id="open-folder" class="btn btn-ghost" title="Open the folder with all recordings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          Saved files
        </button>
        <button id="settings-toggle" class="btn btn-ghost" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" /><circle cx="16" cy="6" r="2" /><circle cx="10" cy="12" r="2" /><circle cx="18" cy="18" r="2" /></svg>
          Settings
        </button>
      </div>
    </aside>

    <main id="content" class="content"></main>
  </div>

  <div id="dock" class="dock" role="toolbar" aria-label="Recorder">
    <div id="dock-wave" class="wave" aria-hidden="true"></div>
    <span id="dock-hint" class="hint">Ready</span>
    <!-- Asked per recording: the call audio is deleted after separation, so it cannot be redone later. -->
    <label id="people-field" class="people" hidden title="Optional. Enter it if you know it: automatic detection can find too many speakers in noisy calls.">
      <span>People on the other side</span>
      <select id="people-count" aria-describedby="people-hint">
        <option value="">Auto</option>
        <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
      </select>
      <span id="people-hint" class="sr-only">Optional. Enter it if you know it: automatic detection can find too many speakers in noisy calls.</span>
    </label>
    <span id="rec-live" class="rec-live" hidden><i class="rec-dot"></i><span id="rec-timer">0:00</span></span>
    <button id="record" class="btn btn-primary" disabled><span class="dot" aria-hidden="true"></span><span>Start recording</span></button>
  </div>

  <div id="settings-backdrop" class="backdrop" hidden>
    <section id="settings" class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title" tabindex="-1">
      <header class="dialog-head">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="icon-btn" type="button" aria-label="Close settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
      </header>

      <div class="dialog-body">
        <section class="set-group" aria-labelledby="set-appearance">
          <h3 id="set-appearance" class="section-label">Appearance</h3>
          <div class="seg" role="group" aria-label="Theme">
            <button type="button" data-theme="system"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>System</button>
            <button type="button" data-theme="light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>Light</button>
            <button type="button" data-theme="dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>Dark</button>
          </div>
        </section>

        <section class="set-group" aria-labelledby="set-recording">
          <h3 id="set-recording" class="section-label">Recording</h3>
          <label class="field">New recordings are
            <select id="recording-kind" aria-describedby="kind-hint">
              <option value="meeting">Meetings</option>
              <option value="lesson">Language classes</option>
            </select>
            <span id="kind-hint" class="hint"></span>
          </label>
          <label class="sw"><input type="checkbox" id="use-system" checked><span class="track"></span><span>System audio<small>Also record the other side of a call (Zoom, Teams, Meet)</small></span></label>
          <label class="sw"><input type="checkbox" id="separate-speakers" disabled aria-describedby="speakers-note"><span class="track"></span><span>Separate speakers<small>After Stop, label the other side as Speaker 1, 2, … The call audio is kept only until then.</small></span></label>
          <p id="speakers-note" class="note"></p>
          <div id="speakers-setup"></div>
          <div class="field-row">
            <label class="field">Spoken language
              <select id="language">
                <option value="auto">Auto-detect</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
              </select>
            </label>
            <label class="field">Names &amp; terms to spell correctly
              <input id="vocabulary" type="text" placeholder="e.g. Kubernetes, Schwechat, Dr. Huber">
            </label>
          </div>
        </section>

        <section class="set-group" aria-labelledby="set-summary">
          <h3 id="set-summary" class="section-label">Summary</h3>
          <label class="sw"><input type="checkbox" id="auto-summary" checked><span class="track"></span><span>Summarize on stop<small>Write the summary or study notes as soon as you stop</small></span></label>
          <label class="field">Summary language
            <select id="summary-language">
              <option value="auto">Same as the recording</option>
              <option value="en">English</option>
              <option value="de">Deutsch</option>
              <option value="pt">Português</option>
            </select>
          </label>
          <p id="summary-setup-note" class="note"></p>
        </section>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
